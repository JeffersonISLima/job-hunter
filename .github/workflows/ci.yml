# CI = Continuous Integration
# Runs on every push/PR to validate the code BEFORE any deploy.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1) Check out the commit/PR code on this temporary runner
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Install Node (same LTS family used in the npm ecosystem)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 3) Native deps (better-sqlite3) need a C++ toolchain
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      # 4) Install dependencies reproducibly (uses package-lock.json)
      - name: Install dependencies
        run: npm ci

      # 5) Typecheck/build — if TypeScript breaks, CI fails here
      - name: Typecheck / build
        run: npm run build

      # 6) Unit tests (fast, no real Telegram/API)
      - name: Unit tests
        run: npm run test:unit

      # 7) Lightweight integration tests (in-memory SQLite)
      - name: Integration tests
        run: npm run test:integration
